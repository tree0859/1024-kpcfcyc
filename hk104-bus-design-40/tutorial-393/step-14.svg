<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">14：標管高後，取下B2才黏管外</title><desc id="desc">乾合合格後記下各管高度，垂直取下B2。只在套管外壁與B2孔壁之間薄上膠，保持管底齊平，按膠水說明待乾。 四管平行、開口暢通，管內及木棒外露段都無膠；B2沒有和下層框或木棒黏在一起。</desc><style>
svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}
.label{font-size:20px;fill:#202a2c;font-weight:600}
.small{font-size:18px;fill:#202a2c}
.card{fill:#eeece6;stroke:#515b5f;stroke-width:1.2}
.wall{fill:#e5e1d7;stroke:#777468;stroke-width:1.2}
.cutout{fill:#fffdf7}
.j1{fill:#b9d6e9;stroke:#215c86;stroke-width:1.5}
.j2{fill:#f4d3ab;stroke:#97521a;stroke-width:1.5}
.block{fill:#b9bec0;stroke:#414b50;stroke-width:1.5}
.pin{fill:#368453;stroke:#154628;stroke-width:1.2}
.tube{fill:#ffdda0;stroke:#8a5e15;stroke-width:1.2}
.hole{fill:#fffdf7;stroke:#414b50;stroke-width:1.2}
.glue{stroke:#b12626;stroke-width:4;fill:none}
.outline{stroke:#515b5f;stroke-width:1.4;fill:none}
.guide{stroke:#515b5f;stroke-width:1.2;stroke-dasharray:5 5;fill:none}
.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38" class="label">取下的B2：只黏套管外壁</text><g transform="translate(0 0) scale(1)"><rect x="50" y="94" width="63.6" height="32" class="card"/><rect x="146.4" y="94" width="83.6" height="32" class="card"/><rect x="114" y="76" width="4.8" height="50" class="tube"/><rect x="141.2" y="76" width="4.8" height="50" class="tube"/></g><line x1="112" y1="99" x2="112" y2="121" class="glue"/><line x1="148" y1="99" x2="148" y2="121" class="glue"/><text x="260" y="89" class="label">管內無膠</text><text x="260" y="131" class="label">管外薄黏</text><text x="28" y="217" class="label">紅短線＝上膠處</text><text x="28" y="254" class="label">下層不要留在旁邊一起灌膠</text><text x="28" y="291" class="label">固定後按膠水指引乾透</text></svg>