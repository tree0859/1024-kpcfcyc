<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">17：試拆與分層保存</title><desc id="desc">建議帶齊組件試拆20次，逐次看框、牆、翻帶黏底有否鬆、裂或翹。取下上層放至少12毫米高邊緣墊塊，避開底肋。 膠層及檯面誤差大時用更高整毫米墊塊；新製作全車灰卡174片，結構內裝663件含F11。</desc><style>svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}text{font-size:19px;fill:#202a2c;font-weight:600}.card{fill:#eeece6;stroke:#515b5f;stroke-width:1.2}.wall{fill:#d4c494;stroke:#777468;stroke-width:1.2}.cutout{fill:#fffdf7;stroke:#515b5f;stroke-dasharray:3 2}.j1{fill:#b9d6e9;stroke:#215c86;stroke-width:1.4}.j2{fill:#f4d3ab;stroke:#97521a;stroke-width:1.4}.strap{fill:#edcadb;stroke:#a33e70;stroke-width:1.4}.outline{stroke:#515b5f;stroke-width:1.5;fill:none}.guide{stroke:#515b5f;stroke-width:1.2;stroke-dasharray:5 5;fill:none}.glue{stroke:#b12626;stroke-width:3;fill:none}.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38">上層邊緣墊高，避開底肋</text><rect x="60" y="110" width="350" height="20" class="card"/><rect x="70" y="130" width="30" height="96" class="j2"/><rect x="370" y="130" width="30" height="96" class="j2"/><rect x="222" y="130" width="18" height="88" class="j1"/><line x1="40" y1="227" x2="430" y2="227" class="outline"/><text x="28" y="278">邊墊至少12，底肋不碰檯</text><text x="28" y="310">20次試拆 ≠ 強度認證</text></svg>