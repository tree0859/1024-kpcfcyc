<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">12：B2開套管孔，套管底齊地板底</title><desc id="desc">B2須為393 × 83、4層1毫米灰卡。依相同四中心先試開Ø4.1孔；套管內Ø2.8、外Ø4，每段長6.25毫米，共4段。 套管穿過4毫米厚B2，底端齊B2底面，上端露2.25毫米；試孔太緊才逐少修至約4.2，先不黏管。</desc><style>
svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}
.label{font-size:20px;fill:#202a2c;font-weight:600}
.small{font-size:18px;fill:#202a2c}
.card{fill:#eeece6;stroke:#515b5f;stroke-width:1.2}
.wall{fill:#e5e1d7;stroke:#777468;stroke-width:1.2}
.cutout{fill:#fffdf7}
.j1{fill:#b9d6e9;stroke:#215c86;stroke-width:1.5}
.j2{fill:#f4d3ab;stroke:#97521a;stroke-width:1.5}
.block{fill:#b9bec0;stroke:#414b50;stroke-width:1.5}
.pin{fill:#368453;stroke:#154628;stroke-width:1.2}
.tube{fill:#ffdda0;stroke:#8a5e15;stroke-width:1.2}
.hole{fill:#fffdf7;stroke:#414b50;stroke-width:1.2}
.glue{stroke:#b12626;stroke-width:4;fill:none}
.outline{stroke:#515b5f;stroke-width:1.4;fill:none}
.guide{stroke:#515b5f;stroke-width:1.2;stroke-dasharray:5 5;fill:none}
.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38" class="label">J13穿B2；底端齊平</text><g transform="translate(0 0) scale(1)"><rect x="50" y="94" width="63.6" height="32" class="card"/><rect x="146.4" y="94" width="83.6" height="32" class="card"/><rect x="114" y="76" width="4.8" height="50" class="tube"/><rect x="141.2" y="76" width="4.8" height="50" class="tube"/></g><text x="260" y="85" class="label">上露2.25</text><text x="260" y="125" class="label">B2厚4</text><line x1="45" y1="126" x2="240" y2="126" class="guide"/><text x="28" y="208" class="label">套管：內Ø2.8／外Ø4</text><text x="28" y="245" class="label">管長6.25；四段先不黏</text><text x="28" y="287" class="label">下面不能凸出B2底面</text></svg>