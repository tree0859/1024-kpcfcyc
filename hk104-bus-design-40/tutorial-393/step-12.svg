<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">12：裁四條翻帶及四對魔術貼</title><desc id="desc">J10裁4條12.28125 × 31.01875，末端反摺7.9828125。J11每面12.28125 × 9.2109375，裁4鉤及4毛，配成4對。 反摺後垂直帶長23.0359375；這些是原件，無須新增材料。</desc><style>svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}text{font-size:19px;fill:#202a2c;font-weight:600}.card{fill:#eeece6;stroke:#515b5f;stroke-width:1.2}.wall{fill:#d4c494;stroke:#777468;stroke-width:1.2}.cutout{fill:#fffdf7;stroke:#515b5f;stroke-dasharray:3 2}.j1{fill:#b9d6e9;stroke:#215c86;stroke-width:1.4}.j2{fill:#f4d3ab;stroke:#97521a;stroke-width:1.4}.strap{fill:#edcadb;stroke:#a33e70;stroke-width:1.4}.outline{stroke:#515b5f;stroke-width:1.5;fill:none}.guide{stroke:#515b5f;stroke-width:1.2;stroke-dasharray:5 5;fill:none}.glue{stroke:#b12626;stroke-width:3;fill:none}.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38">J10四條；J11四鉤＋四毛</text><rect x="65" y="70" width="76" height="190" class="strap"/><line x1="65" y1="211" x2="141" y2="211" class="guide"/><rect x="83" y="112" width="40" height="58" class="j1"/><text x="230" y="107">反摺7.98</text><text x="230" y="161">成長23.04</text><text x="28" y="298">每面魔術貼12.28 × 9.21</text></svg>