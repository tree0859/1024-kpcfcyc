<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">5：標承托面與托翼高度</title><desc id="desc">從地面z0量，框頂與牆頂z80.40625，框底z78.40625。J7托翼頂面對框底，直立面向下貼牆，J8在翼下支承。 左右各5托座、前後各1。建議側中心x49.13、127.73、206.33、284.93、358.61；端面y41.5。</desc><style>svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}text{font-size:19px;fill:#202a2c;font-weight:600}.card{fill:#eeece6;stroke:#515b5f;stroke-width:1.2}.wall{fill:#d4c494;stroke:#777468;stroke-width:1.2}.cutout{fill:#fffdf7;stroke:#515b5f;stroke-dasharray:3 2}.j1{fill:#b9d6e9;stroke:#215c86;stroke-width:1.4}.j2{fill:#f4d3ab;stroke:#97521a;stroke-width:1.4}.strap{fill:#edcadb;stroke:#a33e70;stroke-width:1.4}.outline{stroke:#515b5f;stroke-width:1.5;fill:none}.guide{stroke:#515b5f;stroke-width:1.2;stroke-dasharray:5 5;fill:none}.glue{stroke:#b12626;stroke-width:3;fill:none}.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38">局部剖面：框頂＝牆頂</text><rect x="65" y="96" width="20" height="150" class="wall"/><rect x="85" y="96" width="80" height="20" class="j1"/><line x1="85" y1="116" x2="135" y2="116" class="glue"/> <polygon points="85,118 135,118 85,240" class="card"/><text x="215" y="104">頂80.40625</text><text x="215" y="151">底78.40625</text><text x="28" y="290">托翼頂在框底，不能墊框頂</text></svg>