<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">5：在下層標出框頂及框底高度</title><desc id="desc">以地面z0為基準，標框頂z80.40625、框底z78.40625毫米；兩者相差2毫米。J7水平托翼的上表面對齊框底，直立黏面貼在牆內側向下延伸。 左右各5個托座，建議x49.13、127.73、206.33、284.93、358.61；車頭及車尾各1個，y41.50。共12個，每座配2片J8。</desc><style>
