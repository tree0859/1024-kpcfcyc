</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="36" class="label">側剖面：托翼頂對齊框底</text><rect x="100" y="76" width="20" height="170" class="wall"/><rect x="120" y="76" width="80" height="20" class="j1"/><line x1="120" y1="96" x2="170" y2="96" class="glue"/><line x1="120" y1="96" x2="120" y2="219" class="glue"/><polygon points="120,98 170,98 120,219" class="block"/><line x1="207" y1="76" x2="449" y2="76" class="guide"/><line x1="207" y1="96" x2="449" y2="96" class="guide"/><text x="242" y="65" class="label">框頂80.40625</text><text x="242" y="128" class="label">框底78.40625</text><text x="242" y="190" class="label">J8三角撐在翼下</text><text x="242" y="225" class="label">J7黏牆面向下</text><text x="28" y="300" class="label">示意放大；兩側三角撐只畫一片</text></svg>