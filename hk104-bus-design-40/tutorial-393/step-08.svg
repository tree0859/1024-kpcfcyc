</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38" class="label">四塊同方向：車頭←　→車尾</text><text x="28" y="86" class="label">前塊 ×2</text><text x="266" y="86" class="label">後塊 ×2</text><rect x="28" y="112" width="180" height="88" class="block"/><circle cx="118" cy="156" r="19" class="hole"/><rect x="266" y="112" width="180" height="88" class="block"/><circle cx="402" cy="156" r="19" class="hole"/><text x="28" y="239" class="label">距前6.140625</text><text x="266" y="239" class="label">距前9.28125</text><text x="266" y="273" class="label">距後3</text><text x="28" y="308" class="label">各塊長12.28125、闊6；孔寬向居中</text></svg>