<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">8：分前後J3：後塊孔不能置中</title><desc id="desc">裁36片12.28125 × 6毫米的1毫米灰卡，分成4組，每組9片。前兩組孔心距前短邊6.140625；後兩組距前短邊9.28125、距後短邊3毫米。 所有孔心在6毫米寬方向置中，即距兩側長邊均3毫米。每組先只在上方7片開約Ø2.6試孔，下方2片保持實心。</desc><style>
