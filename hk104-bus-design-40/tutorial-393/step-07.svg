<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">7：用同一基準標四個中心</title><desc id="desc">始終用「車頭在左、右側外緣在上」的共同俯視圖。四孔中心是前右(12.28125,5)、前左(12.28125,78)、後右(388,5)、後左(388,78)。把同一中心轉印到框及B2。 x從車身車頭外緣量，y從車身右側外緣量；不是從承托框內緣量。B2翻面量度時須轉回共同方向核對。</desc><style>
svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}
.label{font-size:20px;fill:#202a2c;font-weight:600}
.small{font-size:18px;fill:#202a2c}
.card{fill:#eeece6;stroke:#515b5f;stroke-width:1.2}
.wall{fill:#e5e1d7;stroke:#777468;stroke-width:1.2}
.cutout{fill:#fffdf7}
.j1{fill:#b9d6e9;stroke:#215c86;stroke-width:1.5}
.j2{fill:#f4d3ab;stroke:#97521a;stroke-width:1.5}
.block{fill:#b9bec0;stroke:#414b50;stroke-width:1.5}
.pin{fill:#368453;stroke:#154628;stroke-width:1.2}
.tube{fill:#ffdda0;stroke:#8a5e15;stroke-width:1.2}
.hole{fill:#fffdf7;stroke:#414b50;stroke-width:1.2}
.glue{stroke:#b12626;stroke-width:4;fill:none}
.outline{stroke:#515b5f;stroke-width:1.4;fill:none}
.guide{stroke:#515b5f;stroke-width:1.2;stroke-dasharray:5 5;fill:none}
.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38" class="label">共同俯視：車頭←　→車尾</text><text x="28" y="86" class="label">前x12.28125</text><text x="310" y="86" class="label">後x388</text><g transform="translate(30 112) scale(1.06)"><rect x="0" y="0" width="393" height="83" class="wall"/><rect x="2" y="2" width="389" height="79" class="cutout"/><rect x="2" y="2" width="389" height="5" class="j1"/><rect x="2" y="76" width="389" height="5" class="j1"/><rect x="2" y="7" width="5" height="69" class="j2"/><rect x="386" y="7" width="5" height="69" class="j2"/><circle cx="12.28125" cy="5" r="2.4" class="pin"/><circle cx="12.28125" cy="78" r="2.4" class="pin"/><circle cx="388" cy="5" r="2.4" class="pin"/><circle cx="388" cy="78" r="2.4" class="pin"/></g><text x="28" y="252" class="label">上邊：右側，孔y5</text><text x="28" y="285" class="label">下邊：左側，孔y78</text><text x="28" y="315" class="label">綠孔心示意放大；不是孔徑</text></svg>