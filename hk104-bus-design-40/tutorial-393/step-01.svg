<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">1：先分清楚：框、接頭塊及地板</title><desc id="desc">把零件分袋：J1左右長條、J2前後短條合成承托框；J3是框下面的四個接頭塊；B2是可以取走的上層地板。 本教程只教四柱承托框及上下層接合，不是整架巴士或樓梯的完整教程；先完成並校正下層空殼。</desc><style>
svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}
.label{font-size:20px;fill:#202a2c;font-weight:600}
.small{font-size:18px;fill:#202a2c}
.card{fill:#eeece6;stroke:#515b5f;stroke-width:1.2}
.wall{fill:#e5e1d7;stroke:#777468;stroke-width:1.2}
.cutout{fill:#fffdf7}
.j1{fill:#b9d6e9;stroke:#215c86;stroke-width:1.5}
.j2{fill:#f4d3ab;stroke:#97521a;stroke-width:1.5}
.block{fill:#b9bec0;stroke:#414b50;stroke-width:1.5}
.pin{fill:#368453;stroke:#154628;stroke-width:1.2}
.tube{fill:#ffdda0;stroke:#8a5e15;stroke-width:1.2}
.hole{fill:#fffdf7;stroke:#414b50;stroke-width:1.2}
.glue{stroke:#b12626;stroke-width:4;fill:none}
.outline{stroke:#515b5f;stroke-width:1.4;fill:none}
.guide{stroke:#515b5f;stroke-width:1.2;stroke-dasharray:5 5;fill:none}
.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}
</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38" class="label">J1 藍：兩條長框</text><rect x="28" y="65" width="424" height="12" class="j1"/><rect x="28" y="91" width="424" height="12" class="j1"/><text x="28" y="146" class="label">J2 橙：前後短框</text><rect x="50" y="165" width="12" height="78" class="j2"/><rect x="178" y="165" width="12" height="78" class="j2"/><text x="270" y="146" class="label">J3 灰：四接頭塊</text><rect x="288" y="170" width="56" height="35" class="block"/><rect x="364" y="170" width="56" height="35" class="block"/><rect x="288" y="222" width="56" height="35" class="block"/><rect x="364" y="222" width="56" height="35" class="block"/><text x="28" y="302" class="label">B2＝上層地板；不是承托框</text></svg>