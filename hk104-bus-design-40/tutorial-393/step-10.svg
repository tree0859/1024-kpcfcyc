<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">10：四塊J3黏在框底，不與框重疊</title><desc id="desc">承托框先開約Ø2.6木棒試孔。J3孔朝上，逐塊貼在框的底面，孔心與框孔同軸；先用無膠的試棒檢查，再固定J3並移走試棒待乾。 J3頂z78.40625、底z69.40625毫米；從框頂量盲孔總深9＝框2＋入塊7。前門洞頂約z68.125，仍須檢查實際門位。</desc><style>
