</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38" class="label">J3頂貼框底；孔朝上</text><rect x="60" y="126" width="59.6" height="16" class="j1"/><rect x="140.4" y="126" width="69.6" height="16" class="j1"/><rect x="80.875" y="142" width="98.25" height="72" class="block"/><rect x="119.6" y="142" width="20.8" height="56" class="hole"/><line x1="81" y1="142" x2="119" y2="142" class="glue"/><line x1="141" y1="142" x2="179" y2="142" class="glue"/><text x="262" y="118" class="label">框厚2</text><text x="262" y="163" class="label">J3高9</text><text x="262" y="207" class="label">塊底封2</text><text x="28" y="269" class="label">膠在塊頂接觸面，不流入孔</text><text x="28" y="303" class="label">由框頂至孔底：2＋7＝9</text></svg>