<main><section class="relief-intro no-print"><div class="eyebrow">40cm / B5 + J13 / 內面局部加工</div><h1>修薄內面，保留外皮。</h1><p>配合內Ø2.8、外Ø4套管，幫你分清楚內面加工範圍、凹深及不能剪穿的外層。左右各兩處，四柱中心不改；本圖是放大示意，不可直接描線裁剪。</p><p><a href="checklist.html#wall-relief-guide">返回四柱安裝指引</a>　／　<a href="cutting.html#cut-P09">B5原尺寸紙樣P09／P10</a>　／　<a href="HK-104-40cm-側牆內面避位加工指引.md">文字加工指引</a></p><div class="note">先用廢卡試件。只在內面逐少刮薄／磨薄，不沿方框剪穿；完成牆厚先量度，再帶側牆與四管乾合。放大圖可用A4橫向列印作加工參考，沒有校準尺，不能當1:1紙樣。手機在圖區左右滑動查看。</div></section>
