<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">28：做扶手、落車鐘及滅火筒</title><desc id="desc">F7切16根外Ø1.5、長36.84375，F8裁16片Ø3.0703125鐘貼，每柱一片。教程示意分配每層8根，先裝下層，另8根留上層；在座椅間隙、通道外緣乾放，不新增固定孔。F9紅紙沿13.42方向捲筒，淨周11.57＋接縫1.84，筒高11.05，再配兩片F10蓋。</desc><style>svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}text{font-size:20px;fill:#202a2c;font-weight:600}.card{fill:#e7e5df;stroke:#505b60;stroke-width:1.2}.paper{fill:#fffdf7;stroke:#505b60;stroke-width:.8}.cutout{fill:#fffdf7;stroke:#454f54;stroke-width:1;stroke-dasharray:3 2}.seat{fill:#dc6d9f;stroke:#8a2b55;stroke-width:.65}.khaki{fill:#c9ba86;stroke:#716447;stroke-width:1}.glass{fill:#d3e8ed;stroke:#386975;stroke-width:1}.glassline{stroke:#386975;stroke-width:3}.aisle{fill:#f4f0d9;stroke:none}.zone{fill:#e9d4ac;stroke:#8b673b;stroke-width:1}.support{fill:#b9d6e9;stroke:#215c86;stroke-width:1}.pin{fill:#368453;stroke:#154628;stroke-width:2}.hole{fill:#fffdf7;stroke:#414b50;stroke-width:1}.grey{fill:#898e90;stroke:#414b50;stroke-width:1}.stair{fill:#252a2c;stroke:#515b60;stroke-width:1}.lightfold{stroke:#fffdf7;stroke-width:1;stroke-dasharray:3 2}.edge{stroke:#505b60;stroke-width:2;fill:none}.fold{stroke:#505b60;stroke-width:1.4;stroke-dasharray:5 5;fill:none}.glue{stroke:#b12626;stroke-width:4;fill:none}.fire{fill:#b34242;stroke:#762929;stroke-width:1}.wheel{fill:#333b3f;stroke:#20272a;stroke-width:1}.hub{fill:#e5e2d4;stroke:#333b3f;stroke-width:1}.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38">16柱配16鐘；滅火筒另捲</text><line x1="70" y1="90" x2="70" y2="240" class="edge"/><circle cx="70" cy="125" r="8" class="fire"/><line x1="145" y1="90" x2="145" y2="240" class="edge"/><circle cx="145" cy="125" r="8" class="fire"/><rect x="268" y="90" width="134.2" height="110.5" class="fire" /><line x1="383.7" y1="90" x2="383.7" y2="200.5" class="fold"/><text x="260" y="239">筒高11.05</text><text x="28" y="278">每層8柱是示意建議，先乾放</text><text x="28" y="313">扶手管外Ø1.5；分層獨立固定</text></svg>