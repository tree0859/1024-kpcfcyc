<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">41：鬆四帶，提至少12毫米後移開</title><desc id="desc">解開全部四帶，雙手托上層地板，均勻垂直提至少12毫米，清掉11.053125毫米底肋後才水平移開。帶齊牆、椅、樓梯與扶手建議試拆20次，檢查框、牆及帶底。</desc><style>svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}text{font-size:19px;fill:#202a2c;font-weight:600}.card{fill:#eeece6;stroke:#515b5f;stroke-width:1.2}.wall{fill:#d4c494;stroke:#777468;stroke-width:1.2}.cutout{fill:#fffdf7;stroke:#515b5f;stroke-dasharray:3 2}.j1{fill:#b9d6e9;stroke:#215c86;stroke-width:1.4}.j2{fill:#f4d3ab;stroke:#97521a;stroke-width:1.4}.strap{fill:#edcadb;stroke:#a33e70;stroke-width:1.4}.outline{stroke:#515b5f;stroke-width:1.5;fill:none}.guide{stroke:#515b5f;stroke-width:1.2;stroke-dasharray:5 5;fill:none}.glue{stroke:#b12626;stroke-width:3;fill:none}.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38">局部剖面：先垂直提，再移開</text><rect x="65" y="164" width="16" height="96" class="wall"/><rect x="81" y="164" width="40" height="16" class="j1"/><g transform="translate(0 -65) scale(1)"><rect x="65" y="132" width="165" height="32" class="card"/></g><line x1="260" y1="166" x2="260" y2="90" class="arrow"/><text x="295" y="102">至少12</text><text x="28" y="290">先鬆全部四帶，雙手托地板</text></svg>