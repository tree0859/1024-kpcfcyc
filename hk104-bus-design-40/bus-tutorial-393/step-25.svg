<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">25：重畫及摺合三個設施紙盒</title><desc id="desc">按下表重畫F1、F2、F3的w、d、w、d四側面，末端加3毫米接縫翼；外框高h＋2d，中央側面高h，上下主蓋各深d。其餘側面加2.4毫米小黏翼，角位剪開但保留主蓋摺線。</desc><style>svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}text{font-size:20px;fill:#202a2c;font-weight:600}.card{fill:#e7e5df;stroke:#505b60;stroke-width:1.2}.paper{fill:#fffdf7;stroke:#505b60;stroke-width:.8}.cutout{fill:#fffdf7;stroke:#454f54;stroke-width:1;stroke-dasharray:3 2}.seat{fill:#dc6d9f;stroke:#8a2b55;stroke-width:.65}.khaki{fill:#c9ba86;stroke:#716447;stroke-width:1}.glass{fill:#d3e8ed;stroke:#386975;stroke-width:1}.glassline{stroke:#386975;stroke-width:3}.aisle{fill:#f4f0d9;stroke:none}.zone{fill:#e9d4ac;stroke:#8b673b;stroke-width:1}.support{fill:#b9d6e9;stroke:#215c86;stroke-width:1}.pin{fill:#368453;stroke:#154628;stroke-width:2}.hole{fill:#fffdf7;stroke:#414b50;stroke-width:1}.grey{fill:#898e90;stroke:#414b50;stroke-width:1}.stair{fill:#252a2c;stroke:#515b60;stroke-width:1}.lightfold{stroke:#fffdf7;stroke-width:1;stroke-dasharray:3 2}.edge{stroke:#505b60;stroke-width:2;fill:none}.fold{stroke:#505b60;stroke-width:1.4;stroke-dasharray:5 5;fill:none}.glue{stroke:#b12626;stroke-width:4;fill:none}.fire{fill:#b34242;stroke:#762929;stroke-width:1}.wheel{fill:#333b3f;stroke:#20272a;stroke-width:1}.hub{fill:#e5e2d4;stroke:#333b3f;stroke-width:1}.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38">四側面w、d、w、d，加3黏翼</text><rect x="40" y="105" width="90" height="90" class="card" /><rect x="130" y="105" width="40" height="90" class="card" /><rect x="170" y="105" width="90" height="90" class="card" /><rect x="260" y="105" width="40" height="90" class="card" /><rect x="300" y="105" width="25" height="90" class="card" /><rect x="40" y="65" width="90" height="40" class="card" /><rect x="40" y="195" width="90" height="40" class="card" /><rect x="130" y="93" width="40" height="12" class="card" /><rect x="130" y="195" width="40" height="12" class="card" /><rect x="170" y="93" width="90" height="12" class="card" /><rect x="170" y="195" width="90" height="12" class="card" /><rect x="260" y="93" width="40" height="12" class="card" /><rect x="260" y="195" width="40" height="12" class="card" /><line x1="130" y1="105" x2="130" y2="195" class="fold"/><line x1="170" y1="105" x2="170" y2="195" class="fold"/><line x1="260" y1="105" x2="260" y2="195" class="fold"/><line x1="300" y1="105" x2="300" y2="195" class="fold"/><line x1="40" y1="105" x2="130" y2="105" class="fold"/><line x1="40" y1="195" x2="130" y2="195" class="fold"/><text x="77" y="160">w</text><text x="143" y="160">d</text><text x="208" y="160">w</text><text x="274" y="160">d</text><text x="28" y="278">上下主蓋深d；小翼2.4</text><text x="28" y="314">先黏四側面，再摺小翼封蓋</text></svg>