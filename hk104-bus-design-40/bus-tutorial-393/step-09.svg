<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">9：疊好J1／J2承托框</title><desc id="desc">J1兩條各389 × 5 × 厚2；J2兩條各69 × 5 × 厚2。J2夾在J1兩端，不疊角。裝到托座上，J1在y2–7及76–81，四邊都內縮車身外緣2。</desc><style>
