</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38" class="label">同一平面；角位對接，不搭疊</text><text x="213" y="88" class="label">J1</text><g transform="translate(30 112) scale(1.06)"><rect x="2" y="2" width="389" height="5" class="j1"/><rect x="2" y="76" width="389" height="5" class="j1"/><rect x="2" y="7" width="5" height="69" class="j2"/><rect x="386" y="7" width="5" height="69" class="j2"/></g><text x="213" y="244" class="label">J1</text><text x="28" y="284" class="label">J2在兩端；完成外廓389 × 79</text><text x="28" y="313" class="label">內空379 × 69；四條名義厚2</text></svg>