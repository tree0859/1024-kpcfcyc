<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">34：裝單片手動門及布膠帶鉸鏈</title><desc id="desc">B11兩層厚2，23.9484375 × 48.5109375，G10已貼內面。門洞24.5625 × 49.125；先乾放確認周邊留隙，再在門洞一條豎邊用薄布膠帶作外鉸鏈，試開向外。</desc><style>svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}text{font-size:20px;fill:#202a2c;font-weight:600}.card{fill:#e7e5df;stroke:#505b60;stroke-width:1.2}.paper{fill:#fffdf7;stroke:#505b60;stroke-width:.8}.cutout{fill:#fffdf7;stroke:#454f54;stroke-width:1;stroke-dasharray:3 2}.seat{fill:#dc6d9f;stroke:#8a2b55;stroke-width:.65}.khaki{fill:#c9ba86;stroke:#716447;stroke-width:1}.glass{fill:#d3e8ed;stroke:#386975;stroke-width:1}.glassline{stroke:#386975;stroke-width:3}.aisle{fill:#f4f0d9;stroke:none}.zone{fill:#e9d4ac;stroke:#8b673b;stroke-width:1}.support{fill:#b9d6e9;stroke:#215c86;stroke-width:1}.pin{fill:#368453;stroke:#154628;stroke-width:2}.hole{fill:#fffdf7;stroke:#414b50;stroke-width:1}.grey{fill:#898e90;stroke:#414b50;stroke-width:1}.stair{fill:#252a2c;stroke:#515b60;stroke-width:1}.lightfold{stroke:#fffdf7;stroke-width:1;stroke-dasharray:3 2}.edge{stroke:#505b60;stroke-width:2;fill:none}.fold{stroke:#505b60;stroke-width:1.4;stroke-dasharray:5 5;fill:none}.glue{stroke:#b12626;stroke-width:4;fill:none}.fire{fill:#b34242;stroke:#762929;stroke-width:1}.wheel{fill:#333b3f;stroke:#20272a;stroke-width:1}.hub{fill:#e5e2d4;stroke:#333b3f;stroke-width:1}.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38">單片手動門；一條豎邊作鉸鏈</text><rect x="62" y="70" width="150" height="220" class="khaki" /><rect x="81" y="91" width="110" height="175" class="paper" /><rect x="100" y="103" width="95" height="160" class="khaki" /><rect x="115" y="131" width="62" height="92" class="glass" /><line x1="97" y1="105" x2="97" y2="260" class="glue"/><line x1="238" y1="181" x2="320" y2="205" class="arrow"/><text x="286" y="116">薄布膠帶</text><text x="286" y="151">只作鉸鏈</text><text x="28" y="318">門縫保持自由；不是自動門</text></svg>