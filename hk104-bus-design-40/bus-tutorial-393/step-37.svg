<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">37：做四條鎖帶及四組魔術貼</title><desc id="desc">J10纖維帶裁4條12.28125 × 31.01875，末端反摺7.9828125，反摺後垂直長23.0359375。J11裁8單面12.28125 × 9.2109375，配成4鉤＋4毛；左右各2帶，中心x61.40625、331.59375。</desc><style>svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}text{font-size:20px;fill:#202a2c;font-weight:600}.card{fill:#e7e5df;stroke:#505b60;stroke-width:1.2}.paper{fill:#fffdf7;stroke:#505b60;stroke-width:.8}.cutout{fill:#fffdf7;stroke:#454f54;stroke-width:1;stroke-dasharray:3 2}.seat{fill:#dc6d9f;stroke:#8a2b55;stroke-width:.65}.khaki{fill:#c9ba86;stroke:#716447;stroke-width:1}.glass{fill:#d3e8ed;stroke:#386975;stroke-width:1}.glassline{stroke:#386975;stroke-width:3}.aisle{fill:#f4f0d9;stroke:none}.zone{fill:#e9d4ac;stroke:#8b673b;stroke-width:1}.support{fill:#b9d6e9;stroke:#215c86;stroke-width:1}.pin{fill:#368453;stroke:#154628;stroke-width:2}.hole{fill:#fffdf7;stroke:#414b50;stroke-width:1}.grey{fill:#898e90;stroke:#414b50;stroke-width:1}.stair{fill:#252a2c;stroke:#515b60;stroke-width:1}.lightfold{stroke:#fffdf7;stroke-width:1;stroke-dasharray:3 2}.edge{stroke:#505b60;stroke-width:2;fill:none}.fold{stroke:#505b60;stroke-width:1.4;stroke-dasharray:5 5;fill:none}.glue{stroke:#b12626;stroke-width:4;fill:none}.fire{fill:#b34242;stroke:#762929;stroke-width:1}.wheel{fill:#333b3f;stroke:#20272a;stroke-width:1}.hub{fill:#e5e2d4;stroke:#333b3f;stroke-width:1}.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38">4條帶；8單面＝4配對</text><rect x="60" y="76" width="70" height="177" class="card" /><line x1="60" y1="207" x2="130" y2="207" class="fold"/><rect x="77" y="112" width="36" height="54" class="support" /><line x1="150" y1="226" x2="211" y2="226" class="arrow"/><rect x="251" y="79" width="70" height="82" class="khaki" /><rect x="251" y="174" width="70" height="81" class="khaki" /><rect x="270" y="117" width="31" height="111" class="card" /><line x1="251" y1="167" x2="321" y2="167" class="fold"/><text x="28" y="294">反摺7.98；先乾貼，包紙後固定</text><text x="28" y="324">四帶可鬆，不能永久跨層黏死</text></svg>