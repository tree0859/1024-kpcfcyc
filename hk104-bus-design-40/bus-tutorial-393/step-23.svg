<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">23：完成52組雙人椅及司機單椅</title><desc id="desc">每組以1片S1、1片S2、2片S3及2片S4組成：先把Z底上翼貼座面底，再貼兩側板，角撐放座面與椅背直角處。壓正待乾；合格試椅計入52組，另做1組司機椅。</desc><style>svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}text{font-size:20px;fill:#202a2c;font-weight:600}.card{fill:#e7e5df;stroke:#505b60;stroke-width:1.2}.paper{fill:#fffdf7;stroke:#505b60;stroke-width:.8}.cutout{fill:#fffdf7;stroke:#454f54;stroke-width:1;stroke-dasharray:3 2}.seat{fill:#dc6d9f;stroke:#8a2b55;stroke-width:.65}.khaki{fill:#c9ba86;stroke:#716447;stroke-width:1}.glass{fill:#d3e8ed;stroke:#386975;stroke-width:1}.glassline{stroke:#386975;stroke-width:3}.aisle{fill:#f4f0d9;stroke:none}.zone{fill:#e9d4ac;stroke:#8b673b;stroke-width:1}.support{fill:#b9d6e9;stroke:#215c86;stroke-width:1}.pin{fill:#368453;stroke:#154628;stroke-width:2}.hole{fill:#fffdf7;stroke:#414b50;stroke-width:1}.grey{fill:#898e90;stroke:#414b50;stroke-width:1}.stair{fill:#252a2c;stroke:#515b60;stroke-width:1}.lightfold{stroke:#fffdf7;stroke-width:1;stroke-dasharray:3 2}.edge{stroke:#505b60;stroke-width:2;fill:none}.fold{stroke:#505b60;stroke-width:1.4;stroke-dasharray:5 5;fill:none}.glue{stroke:#b12626;stroke-width:4;fill:none}.fire{fill:#b34242;stroke:#762929;stroke-width:1}.wheel{fill:#333b3f;stroke:#20272a;stroke-width:1}.hub{fill:#e5e2d4;stroke:#333b3f;stroke-width:1}.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38">每組：S1＋S2＋2片S3＋2片S4</text><rect x="70" y="145" width="172" height="9" class="seat" /><rect x="232" y="69" width="10" height="85" class="seat" /><rect x="100" y="154" width="45" height="5" class="seat" /><rect x="145" y="154" width="5" height="70" class="seat" /><rect x="145" y="219" width="68" height="5" class="seat" /><line x1="100" y1="154" x2="145" y2="154" class="glue"/><line x1="145" y1="154" x2="145" y2="224" class="edge"/><line x1="145" y1="224" x2="213" y2="224" class="edge"/><polygon points="232,108 195,145 232,145" class="seat"/><text x="280" y="95">S1座面／背</text><text x="280" y="153">S4角撐</text><text x="280" y="215">S2座底</text><text x="28" y="276">S3兩側板另貼；底翼向內</text><text x="28" y="310">每組雙人，不是單人椅</text></svg>