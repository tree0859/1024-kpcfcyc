<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">32：帶齊內裝，再試整層自然落座</title><desc id="desc">上層對齊外邊水平放回下層，觀察U框、底肋、角撐、全部104席、樓梯及扶手。任何頂撞都整層提起排查，四角平落才繼續。</desc><style>svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}text{font-size:19px;fill:#202a2c;font-weight:600}.card{fill:#eeece6;stroke:#515b5f;stroke-width:1.2}.wall{fill:#d4c494;stroke:#777468;stroke-width:1.2}.cutout{fill:#fffdf7;stroke:#515b5f;stroke-dasharray:3 2}.j1{fill:#b9d6e9;stroke:#215c86;stroke-width:1.4}.j2{fill:#f4d3ab;stroke:#97521a;stroke-width:1.4}.strap{fill:#edcadb;stroke:#a33e70;stroke-width:1.4}.outline{stroke:#515b5f;stroke-width:1.5;fill:none}.guide{stroke:#515b5f;stroke-width:1.2;stroke-dasharray:5 5;fill:none}.glue{stroke:#b12626;stroke-width:3;fill:none}.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38">整層複驗，四角不可搖晃</text><g transform="translate(30 110) scale(1.06)"><rect x="0" y="0" width="393" height="83" class="card"/><rect x="2" y="2" width="389" height="5" class="j1"/><rect x="2" y="76" width="389" height="5" class="j1"/><rect x="2" y="7" width="5" height="69" class="j2"/><rect x="386" y="7" width="5" height="69" class="j2"/><rect x="106.075" y="7.6" width="4" height="67.8" class="j1"/><rect x="169.9375" y="7.6" width="4" height="67.8" class="j1"/><rect x="243.625" y="7.6" width="4" height="67.8" class="j1"/><rect x="317.3125" y="7.6" width="4" height="67.8" class="j1"/><rect x="36.2296875" y="8" width="52.809375" height="18.9714286" class="cutout"/></g><text x="28" y="254">框／底肋／樓梯各自避位</text><text x="28" y="291">扶手及外皮不能跨層黏死</text></svg>