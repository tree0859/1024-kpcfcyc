<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">35：疊四個15毫米高底腳</title><desc id="desc">每腳用15片12.28125 × 11.8571429灰卡，四腳共60片。待乾後在B1底面靠近四角、前後左右對稱乾放，避開輪位；先標記，確認車身重心及底面平穩再固定。</desc><style>svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}text{font-size:20px;fill:#202a2c;font-weight:600}.card{fill:#e7e5df;stroke:#505b60;stroke-width:1.2}.paper{fill:#fffdf7;stroke:#505b60;stroke-width:.8}.cutout{fill:#fffdf7;stroke:#454f54;stroke-width:1;stroke-dasharray:3 2}.seat{fill:#dc6d9f;stroke:#8a2b55;stroke-width:.65}.khaki{fill:#c9ba86;stroke:#716447;stroke-width:1}.glass{fill:#d3e8ed;stroke:#386975;stroke-width:1}.glassline{stroke:#386975;stroke-width:3}.aisle{fill:#f4f0d9;stroke:none}.zone{fill:#e9d4ac;stroke:#8b673b;stroke-width:1}.support{fill:#b9d6e9;stroke:#215c86;stroke-width:1}.pin{fill:#368453;stroke:#154628;stroke-width:2}.hole{fill:#fffdf7;stroke:#414b50;stroke-width:1}.grey{fill:#898e90;stroke:#414b50;stroke-width:1}.stair{fill:#252a2c;stroke:#515b60;stroke-width:1}.lightfold{stroke:#fffdf7;stroke-width:1;stroke-dasharray:3 2}.edge{stroke:#505b60;stroke-width:2;fill:none}.fold{stroke:#505b60;stroke-width:1.4;stroke-dasharray:5 5;fill:none}.glue{stroke:#b12626;stroke-width:4;fill:none}.fire{fill:#b34242;stroke:#762929;stroke-width:1}.wheel{fill:#333b3f;stroke:#20272a;stroke-width:1}.hub{fill:#e5e2d4;stroke:#333b3f;stroke-width:1}.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38">B12：每腳15層，四腳共60片</text><g transform="translate(30 85) scale(1.06)"><rect x="0" y="0" width="393" height="83" class="card" /><rect x="20" y="12" width="12.28" height="11.86" class="support" /><rect x="20" y="59" width="12.28" height="11.86" class="support" /><rect x="360" y="12" width="12.28" height="11.86" class="support" /><rect x="360" y="59" width="12.28" height="11.86" class="support" /></g><text x="28" y="237">底面腳位是對稱示意，須乾放</text><text x="28" y="274">地板底z15，地板頂z19</text><text x="28" y="312">先找穩定支承，不靠輪承重</text></svg>