</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="38" class="label">J12：Ø約2.5 × 長14</text><rect x="60" y="126" width="59.6" height="16" class="j1"/><rect x="140.4" y="126" width="69.6" height="16" class="j1"/><rect x="80.875" y="142" width="98.25" height="72" class="block"/><rect x="119.6" y="142" width="20.8" height="56" class="hole"/><rect x="120" y="86" width="20" height="112" class="pin"/><text x="260" y="95" class="label">框上露5</text><text x="260" y="139" class="label">穿框2</text><text x="260" y="185" class="label">入塊7</text><text x="28" y="270" class="label">木棒由底端標7及9毫米</text><text x="28" y="304" class="label">綠色＝木棒；外露段不上膠</text></svg>