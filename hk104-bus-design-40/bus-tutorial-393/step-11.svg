<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">11：裝四根14毫米定位棒</title><desc id="desc">四棒Ø約2.5、長14，磨圓端部。由底端標7及9：入J3深7、穿框2，在框頂以上露5。先試孔順暢，薄黏入塊段。</desc><style>
