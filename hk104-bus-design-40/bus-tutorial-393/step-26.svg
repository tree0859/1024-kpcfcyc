<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 330" role="img" aria-labelledby="title desc"><title id="title">26：裝司機台、方向盤、收費器</title><desc id="desc">在司機區x6.14–31.93、y5.93–30.83乾放司機椅及F3；F5兩片Ø7.36875疊成方向盤，配外Ø1.5、長7.36875的F6短柱。F1收費器放x35.62–44.21、y52.17–61.66，確認門及入口可用再固定。</desc><style>svg{background:#fffdf7;color:#202a2c;font-family:'Noto Sans TC',sans-serif}text{font-size:20px;fill:#202a2c;font-weight:600}.card{fill:#e7e5df;stroke:#505b60;stroke-width:1.2}.paper{fill:#fffdf7;stroke:#505b60;stroke-width:.8}.cutout{fill:#fffdf7;stroke:#454f54;stroke-width:1;stroke-dasharray:3 2}.seat{fill:#dc6d9f;stroke:#8a2b55;stroke-width:.65}.khaki{fill:#c9ba86;stroke:#716447;stroke-width:1}.glass{fill:#d3e8ed;stroke:#386975;stroke-width:1}.glassline{stroke:#386975;stroke-width:3}.aisle{fill:#f4f0d9;stroke:none}.zone{fill:#e9d4ac;stroke:#8b673b;stroke-width:1}.support{fill:#b9d6e9;stroke:#215c86;stroke-width:1}.pin{fill:#368453;stroke:#154628;stroke-width:2}.hole{fill:#fffdf7;stroke:#414b50;stroke-width:1}.grey{fill:#898e90;stroke:#414b50;stroke-width:1}.stair{fill:#252a2c;stroke:#515b60;stroke-width:1}.lightfold{stroke:#fffdf7;stroke-width:1;stroke-dasharray:3 2}.edge{stroke:#505b60;stroke-width:2;fill:none}.fold{stroke:#505b60;stroke-width:1.4;stroke-dasharray:5 5;fill:none}.glue{stroke:#b12626;stroke-width:4;fill:none}.fire{fill:#b34242;stroke:#762929;stroke-width:1}.wheel{fill:#333b3f;stroke:#20272a;stroke-width:1}.hub{fill:#e5e2d4;stroke:#333b3f;stroke-width:1}.arrow{stroke:#25643c;stroke-width:3;fill:none;marker-end:url(#arr)}</style><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#25643c"/></marker></defs><text x="28" y="35">前部放大：右側在上</text><g transform="translate(28 65) scale(2.7)"><rect x="0" y="0" width="100" height="83" class="card" /><rect x="2" y="2" width="98" height="79" class="paper" /><rect x="6.14" y="5.93" width="25.79" height="24.9" class="zone" /><rect x="7.37" y="50.39" width="24.56" height="30.83" class="aisle" /><rect x="8" y="11" width="6.14" height="16.6" class="card" /><rect x="16" y="12" width="15.97" height="13.04" class="seat" /><circle cx="14" cy="23" r="3.68" class="wheel"/><rect x="35.62" y="52.17" width="8.6" height="9.49" class="zone" /></g><text x="335" y="105">司機區</text><text x="335" y="222">收費器</text><text x="28" y="315">先乾放；入口與方向盤留空間</text></svg>